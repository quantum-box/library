# Built from a cold cache by the preview-database deploy hook on every
# preview deployment (tachyon.yaml, ADR-0049). Keep the dependency tree
# minimal: no axum/arrow/tonic/AWS stacks, no build scripts needing protoc.
[package]
name = "library-api-preview-migrate"
version = "0.1.0"
edition = "2021"
license.workspace = true

[[bin]]
name = "library_api_preview_migrate"
path = "src/main.rs"

[dependencies]
migration-preflight = { path = "../migration_preflight" }
regex = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt",
    "rt-multi-thread",
], default-features = false }
url = { workspace = true }
