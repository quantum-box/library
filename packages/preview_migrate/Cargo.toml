# Ships as the lambda-library-api-preview-migrate deploy hook (the per-PR
# TiDB is PrivateLink-only, so migrations run inside the enterprise-library
# network). Keep the dependency tree minimal: no axum/arrow/tonic/AWS
# stacks, no build scripts needing protoc.
[package]
name = "library-api-preview-migrate"
version = "0.1.0"
edition = "2021"
license.workspace = true

[[bin]]
name = "library_api_preview_migrate"
path = "src/main.rs"

[dependencies]
migration-preflight = { path = "../migration_preflight" }
lambda_runtime = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt",
    "rt-multi-thread",
], default-features = false }
url = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
