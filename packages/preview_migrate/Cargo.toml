# Kept deliberately small. library-api depends on it for the migration gate,
# and the CLI below replays preview migrations in CI, so it must not pull the
# web/AWS/gRPC stacks the larger workspace crates depend on.
[package]
name = "library-api-preview-migrate"
version = "0.1.0"
edition = "2021"
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "library_api_preview_migrate"
path = "src/bin/cli.rs"

[dependencies]
migration-preflight = { path = "../migration_preflight" }
regex = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
    "time",
], default-features = false }
url = { workspace = true }
