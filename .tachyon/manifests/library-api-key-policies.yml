# Policies an organization's people need on the tachyon side to issue and
# revoke Library API keys, in the flat `policies:` form `tachyon manifest
# apply` reads. (The ActionSet/Policy shape in library-api-runtime.yml and
# library-auth.yml is skipped as unsupported, so those files record rather
# than apply.)
#
# Apply from the Library platform tenant, whose id the namespaces name:
#
#   tachyon manifest apply \
#     -f .tachyon/manifests/library-api-key-policies.yml \
#     --tenant-id tn_01j91h09tpj5ehwbwfwfxpak2b
#
# Applying registers the policies and returns their ids; the attachment is
# library-api's own doing, to the caller in the organization's tenant when
# they issue or revoke a key. The applied ids are compiled into
# `domain::policy`, so re-applying these into another tenant means
# overriding them there through the environment variable each one names.
#
# `shared: true` publishes them to every organization under the Library
# platform: a check made in an organization reads only the policies
# attached in that organization's tenant, so they have to be usable there.
policies:
  # Applied 2026-09-23 as pol_01m36cfejtbmqgmk9pwccjjhn5
  # (`LIBRARY_API_KEY_ISSUER_POLICY_ID` overrides it).
  #
  # A key with repository access carries it through a policy attached to
  # the service account that key is issued on, and removing the key
  # removes the account. Tachyon authorizes both as the caller, and
  # neither action is in LibraryUserPolicy or LibraryRepoOwnerPolicy.
  # library-api grants this only after its own `library:ManageRepoPolicy`
  # check, so it reaches owners. Upstream confines both actions to the
  # calling tenant: the service account and the policy have to belong to,
  # or be visible from, the organization. The grant is as strong as the
  # auth:AttachUserPolicy owners already hold.
  - name: library:ApiKeyIssuer
    namespace: tn_01j91h09tpj5ehwbwfwfxpak2b
    description: Allow Library organization owners to grant and remove the service accounts behind their API keys
    shared: true
    actions:
      - action: auth:AttachServiceAccountPolicy
        effect: allow
      - action: auth:DeleteServiceAccount
        effect: allow

  # Applied 2026-09-23 as pol_01m36cff1vb3eftr27p4f12t1a
  # (`LIBRARY_API_KEY_ACCOUNTS_POLICY_ID` overrides it).
  #
  # Every key gets a service account of its own, so creating one is part
  # of issuing any key -- including a key with no repository access, whose
  # holder is not an owner and gets nothing else. Separate from the issuer
  # policy because an account created alone carries no policy, while
  # attaching one to it is an owner's to do.
  #
  # `auth:CreatePublicApiKey` is here for the account an owner key acts
  # as: a person already holds that one, a service account does not, and
  # an owner key issues keys (`library api-key create`).
  - name: library:ApiKeyAccounts
    namespace: tn_01j91h09tpj5ehwbwfwfxpak2b
    description: Allow Library organization members to create the service account behind an API key they issue
    shared: true
    actions:
      - action: auth:CreateServiceAccount
        effect: allow
      - action: auth:CreatePublicApiKey
        effect: allow
