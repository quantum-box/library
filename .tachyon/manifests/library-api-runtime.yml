# Permissions the library-api service account needs for the work it does
# on nobody's behalf.
#
# Everything a signed-in user asks for is authorized as that user, using
# the caller's own credential (see `sdk_config_with_context`). What is
# left is provisioning the API performs itself, and this policy covers
# exactly that:
#
#   auth:AttachUserPolicy   sign-in seeds the Library policy for the
#                           user in the platform tenant
#   auth:GetOperatorByAlias resolving an organization by username when
#                           the local table misses, including for
#                           anonymous readers who have no credential to
#                           borrow
#
# Attach it to the `library-api-service` service account. Applying this
# manifest only registers the policy; the attachment is a separate
# mutation.
- apiVersion: auth.tachyon.io/v1
  kind: Policy
  metadata:
    name: library:api-runtime
    namespace: tn_01j91h09tpj5ehwbwfwfxpak2b
  spec:
    description: Library API service runtime permissions (operator lookup and user policy attachment)
    actions:
      - action: auth:GetOperatorByAlias
        effect: allow
      - action: auth:AttachUserPolicy
        effect: allow
      # Record body images live in Tachyon storage inside each
      # organization's own tenant, keyed `{org_tenant}/library/images/…`.
      # The service account's credential verifies only in this platform
      # tenant, so requests act here and name the organization through the
      # storage API's `tenant_id` delegation (tachyon-apps branch
      # cfeature/storage-platform-delegation — must be deployed before the
      # image endpoints). Tachyon authorizes each call against
      # `trn:storage:tenant:{org_tenant}` after verifying the organization
      # descends from this platform, which these grants cover because the
      # storage actions are registered with resource_pattern
      # `trn:storage:tenant:*`. Billing for the metered presign-PUT lands
      # on this platform tenant — the organizations have no billing
      # accounts — so the platform tenant itself must have one for uploads
      # to succeed.
      - action: storage:GeneratePresignedPutUrl
        effect: allow
      - action: storage:ConfirmObject
        effect: allow
      - action: storage:GeneratePresignedGetUrl
        effect: allow

# Every Library user may create organizations. `library:CreateOrganization`
# in LibraryUserPolicy is the product-level permission library-api checks;
# this one is the tachyon-side capability the same flow then needs, because
# `create_operator` is authorized against the caller and derives the new
# organization's owner from the caller's identity. LibraryUserPolicy is a
# system policy and cannot be amended through the API, so the action lives
# in this companion policy, attached alongside it at sign-in
# (`LIBRARY_ORG_CREATOR_POLICY_ID` names its applied id).
- apiVersion: auth.tachyon.io/v1
  kind: Policy
  metadata:
    name: library:org-creator
    namespace: tn_01j91h09tpj5ehwbwfwfxpak2b
  spec:
    description: Allow Library platform users to create organizations (operators)
    actions:
      - action: auth:CreateOperator
        effect: allow
