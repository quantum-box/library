# Permissions the library-api service account needs for the work it does
# on nobody's behalf.
#
# Apply matches a policy by name, so renaming one here registers a second
# policy rather than renaming the first: the one already applied keeps its
# id and stays attached to whoever holds it. `library:ApiRuntime` and
# `library:OrgCreator` were applied under their former names
# (`library:api-runtime`, `library:org-creator`), so after the rename is
# applied the new `library:OrgCreator` id belongs in
# `LIBRARY_ORG_CREATOR_POLICY_ID` and the new `library:ApiRuntime` has to
# be attached to the `library-api-service` service account. Until then the
# old policies are what is in force; nothing breaks in the meantime.
#
# Everything a signed-in user asks for is authorized as that user, using
# the caller's own credential (see `sdk_config_with_context`). What is
# left is provisioning the API performs itself, and this policy covers
# exactly that:
#
#   auth:AttachUserPolicy   sign-in seeds the Library policy for the
#                           user in the platform tenant
#   auth:GetOperatorByAlias resolving an organization by username when
#                           the local table misses, including for
#                           anonymous readers who have no credential to
#                           borrow
#
# Attach it to the `library-api-service` service account. Applying this
# manifest only registers the policy; the attachment is a separate
# mutation.
- apiVersion: auth.tachyon.io/v1
  kind: Policy
  metadata:
    name: library:ApiRuntime
    namespace: tn_01j91h09tpj5ehwbwfwfxpak2b
  spec:
    description: Library API service runtime permissions (operator lookup and user policy attachment)
    actions:
      - action: auth:GetOperatorByAlias
        effect: allow
      - action: auth:AttachUserPolicy
        effect: allow
      # The OAuth broker authorizes the platform service, then verifies
      # tenant_id is its descendant and the reader is registered in IaC.
      # User-triggered reads first check the original caller separately.
      - action: auth:GetOAuthToken
        effect: allow
      - action: auth:SaveOAuthToken
        effect: allow
      - action: auth:DeleteOAuthToken
        effect: allow
      # Record body images live in Tachyon storage inside each
      # organization's own tenant, keyed `{org_tenant}/library/images/…`.
      # The service account's credential verifies only in this platform
      # tenant, so requests act here and name the organization through the
      # storage API's `tenant_id` delegation (tachyon-apps branch
      # cfeature/storage-platform-delegation — must be deployed before the
      # image endpoints). Tachyon authorizes each call against
      # `trn:storage:tenant:{org_tenant}` after verifying the organization
      # descends from this platform, which these grants cover because the
      # storage actions are registered with resource_pattern
      # `trn:storage:tenant:*`. Billing for the metered presign-PUT lands
      # on this platform tenant — the organizations have no billing
      # accounts — so the platform tenant itself must have one for uploads
      # to succeed.
      - action: storage:GeneratePresignedPutUrl
        effect: allow
      - action: storage:ConfirmObject
        effect: allow
      - action: storage:GeneratePresignedGetUrl
        effect: allow
      # Presign-PUT's billing gate resolves the Stripe config tenant by
      # reading the acting operator as the caller, so the metered write
      # needs this read too. Presign-GET has no billing gate, which is
      # why a missing grant here surfaces as uploads failing 403 while
      # reads keep working. Applied to the live policy 2026-08-30.
      - action: auth:GetOperatorById
        effect: allow

# Every Library user may create organizations. `library:CreateOrganization`
# in LibraryUserPolicy is the product-level permission library-api checks;
# this one is the tachyon-side capability the same flow then needs, because
# `create_operator` is authorized against the caller and derives the new
# organization's owner from the caller's identity. LibraryUserPolicy is a
# system policy and cannot be amended through the API, so the action lives
# in this companion policy, attached alongside it at sign-in
# (`LIBRARY_ORG_CREATOR_POLICY_ID` names its applied id).
- apiVersion: auth.tachyon.io/v1
  kind: Policy
  metadata:
    name: library:OrgCreator
    namespace: tn_01j91h09tpj5ehwbwfwfxpak2b
  spec:
    description: Allow Library platform users to create organizations (operators)
    actions:
      - action: auth:CreateOperator
        effect: allow

# Organization owners may issue API keys that carry repository access.
# Each key has a service account of its own, and the key's role is a
# Library repository policy attached to that account; removing the key
# removes the account. Tachyon authorizes both as the caller, and neither
# action is in LibraryUserPolicy or LibraryRepoOwnerPolicy, so they live in
# this companion policy.
#
# `shared: true` lets organizations under the Library platform use it: a
# check made in an organization reads only the policies attached in that
# organization's tenant, so library-api attaches this one there, to an
# owner, when they issue or revoke such a key
# (`LIBRARY_API_KEY_ISSUER_POLICY_ID` names its applied id).
#
# Upstream confines both actions to the calling tenant: the service
# account and the policy have to belong to, or be visible from, the
# organization. The grant is as strong as the auth:AttachUserPolicy owners
# already hold through LibraryRepoOwnerPolicy.
- apiVersion: auth.tachyon.io/v1
  kind: Policy
  metadata:
    name: library:ApiKeyIssuer
    namespace: tn_01j91h09tpj5ehwbwfwfxpak2b
  spec:
    description: Allow Library organization owners to grant and remove the service accounts behind their API keys
    shared: true
    actions:
      - action: auth:AttachServiceAccountPolicy
        effect: allow
      - action: auth:DeleteServiceAccount
        effect: allow
