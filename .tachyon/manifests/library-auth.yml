# Custom actions the library apps authorize against.
#
# Applied with the Tachyon CLI, which reads this flat `actions:` shape:
#
#     tachyon manifest apply -f .tachyon/manifests/library-auth.yml \
#       --profile admin --tenant-id tn_01j702qf86pc2j35s0kv0gv3gy
#
# Run `tachyon manifest plan` with the same arguments first. Registering an
# action is additive: an action already present reports as unchanged.
#
# Policies live in library-policies.yml and are NOT applied from here. The
# three library:* policies upstream carry no owner tenant, while an apply
# from this repo would register them against the caller's, so applying them
# risks a second set of policies rather than an update to the ones in use.
actions:
- context: library
  name: CreateApiKey
  description: Create library API key
  resource_pattern: trn:library:api-key:*
- context: library
  name: ListApiKeys
  description: List library API keys
  resource_pattern: trn:library:api-key:*
- context: library
  name: RevokeApiKey
  description: Revoke library API key
  resource_pattern: trn:library:api-key:*
- context: library
  name: CreateOrganization
  description: Create library organization
  resource_pattern: trn:library:org:*
- context: library
  name: UpdateOrganization
  description: Update library organization
  resource_pattern: trn:library:org:*
- context: library
  name: ChangeOrgMemberRole
  description: Change organization member role (OWNER/MANAGER/GENERAL)
  resource_pattern: trn:library:org:*
- context: library
  name: InviteOrgMember
  description: Invite a member to an organization
  resource_pattern: trn:library:org:*
- context: library
  name: CreateRepo
  description: Create library repository
  resource_pattern: trn:library:repo:*
- context: library
  name: ViewPrivateRepo
  description: View private repository
  resource_pattern: trn:library:repo:*
- context: library
  name: ViewRepo
  description: View library repository (resource-based access)
  resource_pattern: trn:library:repo:*
- context: library
  name: UpdateRepo
  description: Update library repository
  resource_pattern: trn:library:repo:*
- context: library
  name: DeleteRepo
  description: Delete library repository
  resource_pattern: trn:library:repo:*
- context: library
  name: ManageRepoPolicy
  description: Manage library repository policy
  resource_pattern: trn:library:repo:*
- context: library
  name: InviteRepoMember
  description: Invite a user to a library repository
  resource_pattern: trn:library:repo:*
- context: library
  name: RemoveRepoMember
  description: Remove a user from a library repository
  resource_pattern: trn:library:repo:*
- context: library
  name: ChangeRepoMemberRole
  description: Change a user's role in a library repository
  resource_pattern: trn:library:repo:*
- context: library
  name: CreateSource
  description: Create library source
  resource_pattern: trn:library:source:*
- context: library
  name: GetSource
  description: Get library source
  resource_pattern: trn:library:source:*
- context: library
  name: UpdateSource
  description: Update library source
  resource_pattern: trn:library:source:*
- context: library
  name: DeleteSource
  description: Delete library source
  resource_pattern: trn:library:source:*
- context: library
  name: FindSources
  description: Find library sources
  resource_pattern: trn:library:source:*
- context: library
  name: ViewData
  description: View library data
  resource_pattern: trn:library:data:*
- context: library
  name: CreateData
  description: Create library data (import from GitHub)
  resource_pattern: trn:tachyon-apps:library:*:*:data:*
- context: library
  name: DeleteData
  description: Delete library data
  resource_pattern: trn:library:data:*
- context: library
  name: AddProperty
  description: Add library property
  resource_pattern: trn:library:property:*
- context: library
  name: UpdateProperty
  description: Update library property
  resource_pattern: trn:library:property:*
- context: library
  name: DeleteProperty
  description: Delete library property
  resource_pattern: trn:library:property:*
- context: library
  name: CreateGlobalIdMapping
  description: Create Global ID mapping (system-of-record write)
  resource_pattern: trn:library:global-id-mapping:*
- context: library
  name: UpdateGlobalIdMapping
  description: Update Global ID mapping
  resource_pattern: trn:library:global-id-mapping:*
- context: library
  name: DeleteGlobalIdMapping
  description: Delete Global ID mapping (logical)
  resource_pattern: trn:library:global-id-mapping:*
- context: library
  name: ReadGlobalIdMapping
  description: Read Global ID mapping (bakuure SA Phase 1 read-only)
  resource_pattern: trn:library:global-id-mapping:*
- context: database
  name: AddProperty
  description: Add property to repository database
  resource_pattern: trn:database:property:*
- context: database
  name: UpdateProperty
  description: Update property of repository database
  resource_pattern: trn:database:property:*
- context: database
  name: DeleteProperty
  description: Delete property from repository database
  resource_pattern: trn:database:property:*
- context: inbound_sync
  name: ListIntegrations
  description: List available integrations
  resource_pattern: trn:inbound_sync:integration:*
- context: inbound_sync
  name: ListConnections
  description: List tenant connections
  resource_pattern: trn:inbound_sync:connection:*
- context: inbound_sync
  name: RegisterWebhookEndpoint
  description: Register a new webhook endpoint
  resource_pattern: trn:inbound_sync:webhook:*
- context: inbound_sync
  name: UpdateWebhookEndpoint
  description: Update a webhook endpoint
  resource_pattern: trn:inbound_sync:webhook:*
- context: inbound_sync
  name: DeleteWebhookEndpoint
  description: Delete a webhook endpoint
  resource_pattern: trn:inbound_sync:webhook:*
- context: inbound_sync
  name: InitialSync
  description: Execute initial sync
  resource_pattern: trn:inbound_sync:sync:*
- context: inbound_sync
  name: OnDemandPull
  description: Execute on-demand pull sync
  resource_pattern: trn:inbound_sync:sync:*
