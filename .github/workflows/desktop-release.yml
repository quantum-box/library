name: Desktop Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Full main commit SHA to release/retry; empty releases current main.'
        required: false

permissions:
  contents: read

# Preserve successive merges instead of replacing the pending release.
# Serializing the whole workflow also prevents an older retry racing promotion.
concurrency:
  group: library-desktop-release
  cancel-in-progress: false
  queue: max

jobs:
  prepare-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      source: ${{ steps.release.outputs.source }}
      build: ${{ steps.release.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag merged version and prepare draft
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          SOURCE_BASE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: node scripts/desktop-release/release.mjs prepare

  verify-client:
    needs: prepare-release
    if: needs.prepare-release.outputs.build == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run type-check
      - run: npm run build

  build-tauri:
    needs: [prepare-release, verify-client]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Every leg rewrites the release's shared latest.json, and tauri-action
      # deletes the old asset before uploading. Two legs finishing together race
      # on that delete and the loser fails with a 404, which is what left
      # library-v0.1.5 an unpublished draft. One at a time is slower but sound.
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
            rust_target: ''
          - platform: windows-latest
            args: ''
            rust_target: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/client/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/client/src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        working-directory: apps/client
        run: npm ci

      - name: Build and upload Tauri binaries
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/client
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  publish-release:
    needs: [prepare-release, build-tauri]
    if: >-
      always() && needs.prepare-release.result == 'success' &&
      (needs.build-tauri.result == 'success' || needs.prepare-release.outputs.build == 'false')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate complete updater feed and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare-release.outputs.source }}
        run: node scripts/desktop-release/release.mjs publish
