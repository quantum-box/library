name: Deploy API to Lambda

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-1
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install Rust target
        run: rustup target add aarch64-unknown-linux-gnu

      - name: Install cargo-lambda
        run: |
          pip install --user cargo-lambda==1.8.6
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      # PLT-942 deploy 復旧 follow-up:
      # `openssl-sys` (transitive via reqwest / rust-s3 / sentry / tachyon-sdk)
      # requires aarch64 OpenSSL headers + libs to cross-compile the Lambda
      # binary. Stock ubuntu-latest only ships amd64 packages, so we add the
      # arm64 architecture and pull `libssl-dev:arm64` from ports.ubuntu.com.
      - name: Install aarch64 cross-compile dependencies
        run: |
          set -euo pipefail
          # Restrict the default sources to amd64 so apt-get does not try to
          # pull arm64 packages from archive.ubuntu.com (which has none).
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i '/^Types: deb$/,/^$/{/^Architectures:/d; s|^Types: deb$|Types: deb\nArchitectures: amd64|}' \
              /etc/apt/sources.list.d/ubuntu.sources
          fi
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i 's|^deb http|deb [arch=amd64] http|' /etc/apt/sources.list || true
          fi
          codename="$(. /etc/os-release && echo "$VERSION_CODENAME")"
          sudo tee /etc/apt/sources.list.d/arm64-ports.list > /dev/null <<EOF
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ ${codename} main universe
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ ${codename}-updates main universe
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ ${codename}-security main universe
          EOF
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libssl-dev:arm64 pkg-config

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lambda-library-api

      - name: Build Lambda
        env:
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig
          OPENSSL_LIB_DIR: /usr/lib/aarch64-linux-gnu
          OPENSSL_INCLUDE_DIR: /usr/include
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo lambda build \
            --package library-api \
            --bin lambda-library-api \
            --release \
            --arm64

      - name: Deploy Lambda
        run: |
          cargo lambda deploy \
            --region ${{ env.AWS_REGION }} \
            --binary-name lambda-library-api \
            lambda-library-api
