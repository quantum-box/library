name: Deploy API to txcloud

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-api.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "apps/api/**"
      - "packages/**"
      - "sdk/rust/**"
      - "tachyon.yaml"
      - "apps/web/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TACHYON_TENANT_ID: tn_01j702qf86pc2j35s0kv0gv3gy
      TACHYON_ENVIRONMENT: production
      TACHYON_CONFIG: tachyon.yaml
      TACHYON_API_KEY: ${{ secrets.TACHYON_API_KEY }}
      GH_TOKEN: ${{ secrets.TACHYON_GITHUB_TOKEN || github.token }}
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v4

      - name: Require txcloud credentials
        run: |
          set -euo pipefail
          test -n "${TACHYON_API_KEY}"
          test -n "${AWS_DEPLOY_ROLE_ARN}"

      - name: Install tachyon CLI
        run: |
          set -euo pipefail
          workdir="${RUNNER_TEMP}/tachyon-cli"
          mkdir -p "${workdir}"

          if ! gh release download \
            --repo quantum-box/tachyon-sdk \
            --pattern 'tachyon-linux-x86_64.tar.gz' \
            --dir "${workdir}"; then
            gh release download \
              --repo quantum-box/tachyon-sdk \
              --pattern 'tachyon-cli-*x86_64-unknown-linux-gnu*.tar.gz' \
              --dir "${workdir}"
          fi

          archive="$(find "${workdir}" -maxdepth 1 -type f -name '*.tar.gz' | head -n 1)"
          test -n "${archive}"
          tar -xzf "${archive}" -C "${workdir}"
          tachyon_bin="$(find "${workdir}" -type f -name tachyon -perm -u+x | head -n 1)"
          test -n "${tachyon_bin}"
          install -m 0755 "${tachyon_bin}" /usr/local/bin/tachyon
          tachyon --version

      - name: Apply Cloud App manifest
        run: |
          set -euo pipefail
          tachyon compute apps apply \
            --file "${TACHYON_CONFIG}" \
            --app library-api \
            --tenant-id "${TACHYON_TENANT_ID}" \
            --environment "${TACHYON_ENVIRONMENT}"

      - name: Apply library-api-migrate manifest
        run: |
          set -euo pipefail
          tachyon compute apps apply \
            --file "${TACHYON_CONFIG}" \
            --app library-api-migrate \
            --tenant-id "${TACHYON_TENANT_ID}" \
            --environment "${TACHYON_ENVIRONMENT}"

      - name: Build and deploy library-api-migrate Lambda
        run: |
          set -euo pipefail
          tachyon compute builds trigger library-api-migrate \
            --tenant-id "${TACHYON_TENANT_ID}" \
            --branch "${GITHUB_REF_NAME}"
          bash scripts/watch-txcloud-build.sh library-api-migrate

      - name: Re-apply library-api-migrate manifest
        run: |
          set -euo pipefail
          tachyon compute apps apply \
            --file "${TACHYON_CONFIG}" \
            --app library-api-migrate \
            --tenant-id "${TACHYON_TENANT_ID}" \
            --environment "${TACHYON_ENVIRONMENT}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Sync library-api-migrate Lambda env from ASM
        run: bash scripts/sync-library-api-migrate-env.sh

      - name: Run production database migrations
        run: bash scripts/invoke-library-api-migrate.sh

      - name: Trigger txcloud build
        run: |
          set -euo pipefail
          tachyon compute builds trigger library-api \
            --tenant-id "${TACHYON_TENANT_ID}" \
            --branch "${GITHUB_REF_NAME}"

      - name: Watch txcloud build
        run: |
          set -euo pipefail
          tachyon compute builds watch library-api \
            --tenant-id "${TACHYON_TENANT_ID}" \
            --timeout-secs 1800

      - name: Smoke test Library API health
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://library.api.n1.tachy.one/health | grep -qx 'OK'
          curl -fsS --max-time 20 https://library.api.n1.tachy.one/version | jq -e '.version | length > 0'

      - name: Smoke test public sign-in route
        run: |
          set -euo pipefail
          curl -fsSIL --max-time 20 https://planet-library.txcloud.app/sign_in
