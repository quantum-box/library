name: Deploy API to Lambda

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      function_url: ${{ steps.function_url.outputs.function_url }}
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-1
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install Rust target
        run: rustup target add aarch64-unknown-linux-gnu

      - name: Install cargo-lambda
        run: |
          pip install --user cargo-lambda==1.8.6
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install aarch64 cross-compile dependencies
        run: |
          set -euo pipefail
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i '/^Types: deb$/,/^$/{/^Architectures:/d; s|^Types: deb$|Types: deb\nArchitectures: amd64|}' \
              /etc/apt/sources.list.d/ubuntu.sources
          fi
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i 's|^deb http|deb [arch=amd64] http|' /etc/apt/sources.list || true
          fi
          codename="$(. /etc/os-release && echo "$VERSION_CODENAME")"
          sudo tee /etc/apt/sources.list.d/arm64-ports.list > /dev/null <<EOF
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ ${codename} main universe
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ ${codename}-updates main universe
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ ${codename}-security main universe
          EOF
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libssl-dev:arm64 pkg-config

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lambda-library-api

      - name: Build Lambda
        env:
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig
          OPENSSL_LIB_DIR: /usr/lib/aarch64-linux-gnu
          OPENSSL_INCLUDE_DIR: /usr/include
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo lambda build \
            --package library-api \
            --bin lambda-library-api \
            --release \
            --arm64

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Lambda
        run: |
          cargo lambda deploy \
            --region ${{ env.AWS_REGION }} \
            --binary-name lambda-library-api \
            lambda-library-api

      - name: Configure Lambda DB pool env
        run: |
          set -euo pipefail
          current_env="$(aws lambda get-function-configuration \
            --region "${AWS_REGION}" \
            --function-name lambda-library-api \
            --query 'Environment.Variables' \
            --output json)"
          merged_env="$(jq -c '. // {} | . + {
            DB_POOL_MAX_CONNECTIONS: "16",
            DB_POOL_ACQUIRE_TIMEOUT_SECS: "10",
            DB_POOL_ACQUIRE_METRICS_ENABLED: "true",
            DB_POOL_ACQUIRE_METRICS_INTERVAL_SECS: "60",
            DB_POOL_ACQUIRE_WARN_MS: "250"
          }' <<< "${current_env}")"
          aws lambda update-function-configuration \
            --region "${AWS_REGION}" \
            --function-name lambda-library-api \
            --environment "{\"Variables\":${merged_env}}"
          aws lambda wait function-updated \
            --region "${AWS_REGION}" \
            --function-name lambda-library-api

      - name: Resolve Function URL
        id: function_url
        run: |
          function_url="$(aws lambda get-function-url-config \
            --region "${AWS_REGION}" \
            --function-name lambda-library-api \
            --query 'FunctionUrl' \
            --output text)"
          echo "function_url=${function_url}" >> "$GITHUB_OUTPUT"
          {
            echo "### Library API Lambda"
            echo ""
            echo "Function URL: ${function_url}"
          } >> "$GITHUB_STEP_SUMMARY"

  smoke-test:
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 3
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-1
      FUNCTION_URL: ${{ needs.deploy.outputs.function_url }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Smoke test Lambda Function URL
        run: |
          test -n "${FUNCTION_URL}"

          health_url="${FUNCTION_URL%/}/"
          for attempt in 1 2 3 4 5 6; do
            response="$(curl -fsSL --max-time 20 "${health_url}" || true)"
            if [ "${response}" = "OK" ]; then
              echo "Smoke test passed: ${health_url}"
              exit 0
            fi
            echo "Smoke test attempt ${attempt} failed; retrying..."
            sleep 10
          done

          echo "Smoke test failed: ${health_url}"
          exit 1
