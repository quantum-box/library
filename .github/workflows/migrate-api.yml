name: Run library-api production migration

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TACHYON_TENANT_ID: tn_01j702qf86pc2j35s0kv0gv3gy
      TACHYON_ENVIRONMENT: production
      TACHYON_CONFIG: tachyon.yaml
      TACHYON_API_KEY: ${{ secrets.TACHYON_API_KEY }}
      GH_TOKEN: ${{ secrets.TACHYON_GITHUB_TOKEN || github.token }}
      AWS_REGION: ap-northeast-1
    steps:
      - uses: actions/checkout@v4

      - name: Require txcloud credentials
        run: |
          set -euo pipefail
          test -n "${TACHYON_API_KEY}"

      - name: Install tachyon CLI
        run: |
          set -euo pipefail
          workdir="${RUNNER_TEMP}/tachyon-cli"
          mkdir -p "${workdir}"

          if ! gh release download \
            --repo quantum-box/tachyon-sdk \
            --pattern 'tachyon-linux-x86_64.tar.gz' \
            --dir "${workdir}"; then
            gh release download \
              --repo quantum-box/tachyon-sdk \
              --pattern 'tachyon-cli-*x86_64-unknown-linux-gnu*.tar.gz' \
              --dir "${workdir}"
          fi

          archive="$(find "${workdir}" -maxdepth 1 -type f -name '*.tar.gz' | head -n 1)"
          test -n "${archive}"
          tar -xzf "${archive}" -C "${workdir}"
          tachyon_bin="$(find "${workdir}" -type f -name tachyon -perm -u+x | head -n 1)"
          test -n "${tachyon_bin}"
          install -m 0755 "${tachyon_bin}" /usr/local/bin/tachyon
          tachyon --version

      - name: Apply library-api-migrate manifest
        run: |
          set -euo pipefail
          tachyon compute apps apply \
            --file "${TACHYON_CONFIG}" \
            --app library-api-migrate \
            --tenant-id "${TACHYON_TENANT_ID}" \
            --environment "${TACHYON_ENVIRONMENT}"

      - name: Build and deploy migration Lambda
        run: |
          set -euo pipefail
          tachyon compute builds trigger library-api-migrate \
            --tenant-id "${TACHYON_TENANT_ID}" \
            --branch "${{ github.ref_name }}"
          tachyon compute builds watch library-api-migrate \
            --tenant-id "${TACHYON_TENANT_ID}" \
            --timeout-secs 1800

      - name: Configure AWS credentials
        if: ${{ secrets.N1_AWS_TERRAFORM_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.N1_AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Invoke migration Lambda
        if: ${{ secrets.N1_AWS_TERRAFORM_ROLE_ARN != '' }}
        run: |
          set -euo pipefail
          aws lambda invoke \
            --function-name lambda-library-api-migrate \
            --invocation-type RequestResponse \
            --cli-binary-format raw-in-base64-out \
            --payload '{}' \
            /tmp/library-api-migrate-out.json
          cat /tmp/library-api-migrate-out.json
          python3 - <<'PY'
          import json
          import sys

          payload = json.load(open("/tmp/library-api-migrate-out.json"))
          if payload.get("status") == "ok":
              sys.exit(0)
          if payload.get("errorMessage"):
              print(payload["errorMessage"], file=sys.stderr)
              sys.exit(1)
          print(f"Unexpected migration response: {payload}", file=sys.stderr)
          sys.exit(1)
          PY
