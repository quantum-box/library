name: Run library-api production migrations

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Git branch to build library-api-migrate from
        required: false
        default: main
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TACHYON_TENANT_ID: tn_01j702qf86pc2j35s0kv0gv3gy
      TACHYON_ENVIRONMENT: production
      TACHYON_CONFIG: tachyon.yaml
      TACHYON_API_KEY: ${{ secrets.TACHYON_API_KEY }}
      GH_TOKEN: ${{ secrets.TACHYON_GITHUB_TOKEN || github.token }}
      MIGRATE_BRANCH: ${{ inputs.branch || github.ref_name }}
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Require txcloud and migration invoke credentials
        run: |
          set -euo pipefail
          test -n "${TACHYON_API_KEY}"
          test -n "${AWS_DEPLOY_ROLE_ARN}"

      - name: Install tachyon CLI
        run: |
          set -euo pipefail
          workdir="${RUNNER_TEMP}/tachyon-cli"
          mkdir -p "${workdir}"

          if ! gh release download \
            --repo quantum-box/tachyon-sdk \
            --pattern 'tachyon-linux-x86_64.tar.gz' \
            --dir "${workdir}"; then
            gh release download \
              --repo quantum-box/tachyon-sdk \
              --pattern 'tachyon-cli-*x86_64-unknown-linux-gnu*.tar.gz' \
              --dir "${workdir}"
          fi

          archive="$(find "${workdir}" -maxdepth 1 -type f -name '*.tar.gz' | head -n 1)"
          test -n "${archive}"
          tar -xzf "${archive}" -C "${workdir}"
          tachyon_bin="$(find "${workdir}" -type f -name tachyon -perm -u+x | head -n 1)"
          test -n "${tachyon_bin}"
          install -m 0755 "${tachyon_bin}" /usr/local/bin/tachyon
          tachyon --version

      - name: Apply library-api-migrate manifest
        run: |
          set -euo pipefail
          tachyon compute apps apply \
            --file "${TACHYON_CONFIG}" \
            --app library-api-migrate \
            --tenant-id "${TACHYON_TENANT_ID}" \
            --environment "${TACHYON_ENVIRONMENT}"

      - name: Trigger txcloud build for library-api-migrate
        run: |
          set -euo pipefail
          tachyon compute builds trigger library-api-migrate \
            --tenant-id "${TACHYON_TENANT_ID}" \
            --branch "${MIGRATE_BRANCH}"
          sleep 15
          bash scripts/watch-txcloud-build.sh library-api-migrate

      - name: Re-apply library-api-migrate manifest
        run: |
          set -euo pipefail
          tachyon compute apps apply \
            --file "${TACHYON_CONFIG}" \
            --app library-api-migrate \
            --tenant-id "${TACHYON_TENANT_ID}" \
            --environment "${TACHYON_ENVIRONMENT}"

      - name: "Temporary migration bridge: configure AWS credentials"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: "Temporary migration bridge: sync txcloud Lambda env"
        run: bash scripts/sync-library-api-migrate-env.sh

      - name: "Temporary migration bridge: invoke migration Lambda"
        run: bash scripts/invoke-library-api-migrate.sh
