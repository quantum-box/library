# Tachyon Cloud App の GitHub Actions build backend が dispatch する workflow。
# Tachyon は protected ref (refs/heads/main) のこのファイルだけを起動する。
# dispatch input は build_id のみで、API URL・コマンド・secret は受け取らない。
name: Tachyon Cloud App build
on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Tachyon build ID
        type: string
        required: true
permissions:
  contents: read
  id-token: write
  # Rust builder image (ghcr.io/quantum-box/cloud-app-rust-builder) の pull に使う。
  packages: read
concurrency:
  group: tachyon-build-${{ inputs.build_id }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    # library-api の release cross build (cargo lambda + zig, arm64) はキャッシュなしで走る。
    timeout-minutes: 120
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Action は runner の docker CLI で builder image を pull する（HOME は引き継がれる）。
      # package が private の間は、この login と package 側での library への read 付与が必要。
      # build container には runner の home を mount しないので、この credential は build から見えない。
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      # install/build は Action の container 内で実行される。
      # この runner に入れた toolchain は container からは見えない。
      - uses: quantum-box/tachyon-ops-action/cloud-app-build@e583793952cab912869e1baa040a3701bcaf068a
        with:
          api-url: https://api.n1.tachy.one
          build-id: ${{ inputs.build_id }}
          # cargo lambda app (library-api) 用の digest 固定 toolchain image。
          rust-builder-image: ghcr.io/quantum-box/cloud-app-rust-builder@sha256:bc003cf0ffca3e8259a2480092d612195193a99a4dcdab1eaa2afabff191dcba
