name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  rust-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler
      - run: cargo clippy --workspace -- -D warnings

  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: sudo apt-get install -y protobuf-compiler
      - run: cargo check --workspace

  rust-workspace-cycles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-rust-workspace-cycles.mjs

  rust-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ""
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-nextest
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler default-mysql-client
      - run: cargo nextest run --workspace
      - name: Run Library GA CRUD regression
        env:
          DEV_DATABASE_URL: mysql://root:@127.0.0.1:3306
          LIBRARY_DATABASE_URL: mysql://root:@127.0.0.1:3306/library
          DATABASE_URL: mysql://root:@127.0.0.1:3306/library
          ROOT_ID: tn_01j702qf86pc2j35s0kv0gv3gy
          LIBRARY_TENANT_ID: tn_01j702qf86pc2j35s0kv0gv3gy
          ENVIRONMENT: test
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          mysql --protocol=TCP -h 127.0.0.1 -P 3306 -u root -e "
            CREATE DATABASE IF NOT EXISTS tachyon_apps_auth;
            CREATE TABLE IF NOT EXISTS tachyon_apps_auth.tenants (
              id VARCHAR(29) NOT NULL PRIMARY KEY,
              parent_tenant_id VARCHAR(29) NULL
            );
          "
          cargo run -p database-manager --bin database_manager_migrate dev
          cargo run -p library-api --bin library_api_migrate dev
          cargo test -p library-api --features integration_tests --test ga_crud_regression -- --test-threads=1

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn tsc
      - name: Build
        env:
          VITE_BACKEND_API_URL: ${{ vars.VITE_BACKEND_API_URL }}
        run: yarn build
