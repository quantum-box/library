name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  rust-clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: scripts/ci/apt-install.sh protobuf-compiler
      # PLT-3335 tracks the pre-existing warnings exposed by nightly drift.
      # Only these two lints are temporarily allowed; all others stay denied.
      - run: cargo clippy --workspace -- -D warnings -A clippy::double_must_use -A clippy::redundant_field_names

  rust-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        run: scripts/ci/apt-install.sh protobuf-compiler
      - run: cargo check --workspace

  rust-workspace-cycles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-rust-workspace-cycles.mjs

  rust-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ""
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-nextest
      - name: Install protoc
        run: scripts/ci/apt-install.sh protobuf-compiler default-mysql-client
      - run: cargo nextest run --workspace
      - name: Run Library GA database regressions
        env:
          DEV_DATABASE_URL: mysql://root:@127.0.0.1:3306
          LIBRARY_DATABASE_URL: mysql://root:@127.0.0.1:3306/library
          DATABASE_URL: mysql://root:@127.0.0.1:3306/library
          ROOT_ID: tn_01j702qf86pc2j35s0kv0gv3gy
          LIBRARY_TENANT_ID: tn_01j702qf86pc2j35s0kv0gv3gy
          ENVIRONMENT: test
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          mysql --protocol=TCP -h 127.0.0.1 -P 3306 -u root -e "
            CREATE DATABASE IF NOT EXISTS tachyon_apps_auth;
            CREATE TABLE IF NOT EXISTS tachyon_apps_auth.tenants (
              id VARCHAR(29) NOT NULL PRIMARY KEY,
              parent_tenant_id VARCHAR(29) NULL
            );
          "
          cargo run -p database-manager --bin database_manager_migrate dev
          cargo test -p database-manager --test tenant_composite_foreign_keys -- --ignored --test-threads=1
          cargo test -p database-manager --test tenant_database_scope -- --ignored --test-threads=1
          cargo test -p database-manager --test paging -- --ignored --test-threads=1
          cargo test -p database-manager --test property_value_schema -- --ignored --test-threads=1
          cargo test -p database-manager --test property_definition_schema -- --ignored --test-threads=1
          cargo test -p database-manager --test property_definition_dual_write -- --ignored --test-threads=1
          cargo test -p database-manager --test property_value_dual_write -- --ignored --test-threads=1
          cargo test -p database-manager --test property_value_backfill -- --ignored --test-threads=1
          cargo test -p database-manager --test record_version_schema -- --ignored --test-threads=1
          cargo test -p database-manager --test record_mutation_schema -- --ignored --test-threads=1
          cargo test -p database-manager --test record_patch_decision -- --ignored --test-threads=1
          cargo test -p database-manager --test property_schema_concurrency -- --ignored --test-threads=1
          cargo test -p database-manager --test relation_definition_schema -- --ignored --test-threads=1
          cargo test -p database-manager --test relation_definition_contract -- --ignored --test-threads=1
          cargo test -p database-manager --test relation_schema_mutation -- --ignored --test-threads=1
          cargo test -p database-manager --test relation_edge_schema -- --ignored --test-threads=1
          cargo test -p database-manager --test relation_edge_contract -- --ignored --test-threads=1
          cargo test -p database-manager --lib dormant_relation_writer_dual_writes_and_serializes_cardinality -- --ignored --test-threads=1
          cargo test -p database-manager --lib dormant_record_create_uow -- --ignored --test-threads=1
          cargo test -p database-manager --lib dormant_record_delete_uow -- --ignored --test-threads=1
          cargo test -p database-manager --test database_delete_atomicity -- --ignored --test-threads=1
          cargo test -p database-manager --test index_definition_schema -- --ignored --test-threads=1
          cargo test -p database-manager --test index_definition_contract -- --ignored --test-threads=1
          cargo run -p library-api --bin library_api_migrate dev
          cargo test -p library-api-preview-migrate --lib preview_migrations_replay_on_empty_mysql -- --ignored --test-threads=1
          cargo test -p library-api --features integration_tests --test ga_crud_regression -- --test-threads=1

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable Corepack
        run: corepack enable
      - name: Reject legacy Yarn .yarnrc spec key (PLT-1762)
        run: |
          if [ -f .yarnrc.yml ] && grep -Eq '^[[:space:]]*spec:' .yarnrc.yml; then
            echo "ERROR: .yarnrc.yml must not contain legacy 'spec:' (Yarn 4). Use package.json packageManager instead."
            exit 1
          fi
      - name: Install dependencies
        run: yarn install --immutable
      - name: Lint
        run: yarn lint
      - name: Unit tests
        run: yarn test
      - name: Type check
        run: yarn tsc
      - name: Resolve Vite backend API URL
        id: vite_backend
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            url="https://pr${{ github.event.pull_request.number }}--library-api.txcloud.app"
          else
            url="${{ vars.VITE_BACKEND_API_URL }}"
          fi
          if [ -z "${url}" ]; then
            echo "VITE_BACKEND_API_URL is empty (set vars.VITE_BACKEND_API_URL for non-PR builds)"
            exit 1
          fi
          echo "url=${url}" >> "${GITHUB_OUTPUT}"
          echo "Using VITE_BACKEND_API_URL host: $(echo "${url}" | sed -E 's#https?://([^/]+)/?.*#\1#')"

      - name: Build
        env:
          VITE_BACKEND_API_URL: ${{ steps.vite_backend.outputs.url }}
        run: yarn build
      # The user guide is a separate workspace, so `yarn lint` / `tsc` /
      # `build` above, which are all scoped to library-web, do not cover it.
      - name: Lint (user guide)
        run: yarn guide:lint
      - name: Type check (user guide)
        run: yarn guide:ts
      - name: Build (user guide)
        env:
          VITE_LIBRARY_API_BASE_URL: ${{ steps.vite_backend.outputs.url }}
        run: yarn guide:build
      - name: Install Playwright browsers
        run: |
          scripts/ci/apt-harden.sh
          scripts/ci/with-retry.sh --attempts 3 --timeout 300 --cleanup scripts/ci/apt-unlock.sh -- \
            yarn workspace library-web exec playwright install --with-deps chromium
      - name: E2E tests
        run: yarn test:e2e
      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  client:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/client/package-lock.json
      - name: Install client dependencies
        run: npm ci
      - name: Lint client
        run: npm run lint
      - name: Test client
        run: npm run test
      - name: Test Photon Live Worker
        run: npm run test:worker
      - name: Type check client
        run: npm run type-check
      - name: Type check client Worker
        run: npm run type-check:worker
      - name: Build client
        timeout-minutes: 15
        run: npm run build
      - name: Install Playwright Chromium
        run: |
          "${{ github.workspace }}/scripts/ci/apt-harden.sh"
          "${{ github.workspace }}/scripts/ci/with-retry.sh" --attempts 3 --timeout 300 \
            --cleanup "${{ github.workspace }}/scripts/ci/apt-unlock.sh" -- \
            npx playwright install --with-deps chromium
      - name: Run client E2E
        id: client_e2e
        timeout-minutes: 20
        run: npm run test:e2e
      - name: Run Photon Live E2E
        id: client_live_e2e
        timeout-minutes: 10
        run: npm run test:e2e:live
      - name: Upload client Playwright diagnostics
        if: ${{ always() && (steps.client_e2e.outcome == 'failure' || steps.client_live_e2e.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: client-playwright-report
          path: |
            apps/client/playwright-report/
            apps/client/test-results/
          if-no-files-found: warn
          retention-days: 7
