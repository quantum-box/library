name: Chromatic

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/chromatic.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromatic:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: corepack enable
      - run: yarn install --immutable

      - name: Check for Storybook build script
        id: storybook
        working-directory: apps/web
        run: |
          if node -e "const pkg = require('./package.json'); process.exit(pkg.scripts?.['build-storybook'] ? 0 : 1)"; then
            echo "has_build_script=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_build_script=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Chromatic
        if: steps.storybook.outputs.has_build_script == 'true'
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: apps/web
          autoAcceptChanges: main
          onlyChanged: true
          exitOnceUploaded: true
          skip: "@(renovate/**|dependabot/**)"
