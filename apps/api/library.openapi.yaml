  /v1beta/repos/{org}/{repo}/data/{data_id}/upsert:
    put:
      description: |-
        `PUT /data/{data_id}` deliberately keeps its update-only meaning — a caller
        that edits a record it believes exists still wants a 404 when it does not.
        This route is for the other caller: one that assigned the record id itself
        and cannot tell its first write from an edit, because both look the same
        from its side. Answering that with a 404 drops the record.

        `property_data` is a patch on the existing branch, exactly as
        `update_data` treats it: a Property left out keeps whatever it holds.
      operationId: upsert_data
      parameters:
      - description: Organization username
        in: path
        name: org
        required: true
        schema:
          type: string
      - description: Repository username
        in: path
        name: repo
        required: true
        schema:
          type: string
      - description: Data ID chosen by the caller
        in: path
        name: data_id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertDataRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataResponse'
          description: Existing data updated
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataResponse'
          description: Data created at the given ID
        '400':
          description: Invalid request
        '404':
          description: Repository or property not found
      summary: |-
        Create the record at `data_id`, or apply the payload to the one already
        there.
