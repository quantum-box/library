components:
  schemas:
    AddDataRequest:
      properties:
        name:
          type: string
        property_data:
          items:
            $ref: '#/components/schemas/PropertyDataRequest'
          type: array
      required:
      - name
      - property_data
      type: object
    AddPropertyRequest:
      properties:
        auto_generate:
          type:
          - boolean
          - 'null'
        name:
          type: string
        property_type:
          type: string
      required:
      - name
      - property_type
      type: object
    ChangeRepoUsernameRequest:
      properties:
        new_username:
          type: string
      required:
      - new_username
      type: object
    CreateOrganizationRequest:
      properties:
        description:
          type:
          - string
          - 'null'
        name:
          type: string
        username:
          type: string
        website:
          type:
          - string
          - 'null'
      required:
      - name
      - username
      type: object
    CreateRepoRequest:
      properties:
        database_id:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        is_public:
          type: boolean
        name:
          type: string
        username:
          type: string
      required:
      - name
      - username
      - is_public
      type: object
    CreateSourceRequest:
      properties:
        name:
          type: string
        url:
          type:
          - string
          - 'null'
      required:
      - name
      type: object
    DataListResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/DataResponse'
          type: array
        paginator:
          $ref: '#/components/schemas/OffsetPaginator'
      required:
      - data
      - paginator
      type: object
    DataPaginationQuery:
      properties:
        page:
          description: |-
            1-origin page number. The legacy `offset` alias is also interpreted as
            a page number and therefore must be at least 1.
          format: int32
          minimum: 1
          type:
          - integer
          - 'null'
        page_size:
          description: Number of records per page. The legacy `limit` alias remains accepted.
          format: int32
          maximum: 100
          minimum: 1
          type:
          - integer
          - 'null'
      type: object
    DataResponse:
      properties:
        id:
          type: string
        items:
          items:
            $ref: '#/components/schemas/PropertyDataResponse'
          type: array
        name:
          type: string
        recordVersion:
          description: |-
            Decimal Library record revision. Serialized as a string so clients do
            not lose precision when BIGINT values exceed JavaScript's safe range.
          type: string
        url:
          description: |-
            Absolute URL that opens this document in the Library client, so
            integrators can link back without rebuilding the route themselves.
            Always points at the client, never at the older web app, and its
            origin comes from `LIBRARY_CLIENT_BASE_URL`.
          type: string
      required:
      - id
      - name
      - recordVersion
      - url
      - items
      type: object
    GlobalIdMappingResponse:
      properties:
        created_at:
          type: string
        global_id:
          type: string
        id:
          type: string
        name:
          type: string
        system:
          type: string
        system_code:
          type: string
        updated_at:
          type: string
      required:
      - id
      - global_id
      - system
      - system_code
      - name
      - created_at
      - updated_at
      type: object
    Location:
      description: |-
        # Location
        TODO: add English documentation
      properties:
        latitude:
          description: 'TODO: add English documentation'
          format: double
          type: number
        longitude:
          description: 'TODO: add English documentation'
          format: double
          type: number
      required:
      - latitude
      - longitude
      type: object
    OffsetPaginator:
      description: |-
        Metadata for a validated [`OffsetPage`].

        `current_page` is never clamped to the last page. An out-of-range request
        therefore returns an empty item list with the requested page preserved.
        Empty result sets have zero total pages.
      properties:
        current_page:
          format: int32
          minimum: 1
          type: integer
        items_per_page:
          format: int32
          maximum: 100
          minimum: 1
          type: integer
        total_items:
          format: int32
          minimum: 0
          type: integer
        total_pages:
          format: int32
          minimum: 0
          type: integer
      required:
      - current_page
      - items_per_page
      - total_items
      - total_pages
      type: object
    OrganizationResponse:
      properties:
        description:
          type:
          - string
          - 'null'
        id:
          type: string
        name:
          type: string
        repos:
          items:
            $ref: '#/components/schemas/RepoResponse'
          type: array
        username:
          type: string
        website:
          type:
          - string
          - 'null'
      required:
      - id
      - name
      - username
      - repos
      type: object
    ParquetResponse:
      properties:
        presigned_url:
          type: string
      required:
      - presigned_url
      type: object
    PropertyDataRequest:
      properties:
        property_id:
          type: string
        value: {}
      required:
      - property_id
      - value
      type: object
    PropertyDataResponse:
      properties:
        key:
          type: string
        property_id:
          type: string
        value:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/PropertyDataValue'
      required:
      - property_id
      - key
      type: object
    PropertyDataValue:
      oneOf:
      - properties:
          string:
            type: string
        required:
        - string
        type: object
      - properties:
          integer:
            format: int32
            type: integer
        required:
        - integer
        type: object
      - properties:
          html:
            type: string
        required:
        - html
        type: object
      - properties:
          markdown:
            type: string
        required:
        - markdown
        type: object
      - properties:
          relation:
            properties:
              data_id:
                items:
                  type: string
                type: array
              database_id:
                type: string
            required:
            - database_id
            - data_id
            type: object
        required:
        - relation
        type: object
      - properties:
          id:
            type: string
        required:
        - id
        type: object
      - properties:
          select:
            type: string
        required:
        - select
        type: object
      - properties:
          multiSelect:
            items:
              type: string
            type: array
        required:
        - multiSelect
        type: object
      - properties:
          location:
            $ref: '#/components/schemas/Location'
        required:
        - location
        type: object
      - properties:
          date:
            type: string
        required:
        - date
        type: object
      - properties:
          image:
            type: string
        required:
        - image
        type: object
      - description: A block document, carried as JSON text.
        properties:
          richText:
            description: A block document, carried as JSON text.
            type: string
        required:
        - richText
        type: object
    PropertyResponse:
      properties:
        auto_generate:
          type:
          - boolean
          - 'null'
        deprecation:
          type:
          - string
          - 'null'
        id:
          type: string
        name:
          type: string
        property_type:
          type: string
      required:
      - id
      - name
      - property_type
      type: object
    RepoResponse:
      properties:
        description:
          type:
          - string
          - 'null'
        id:
          type: string
        is_public:
          type: boolean
        name:
          type: string
        org_username:
          type: string
        organization_id:
          type: string
        username:
          type: string
      required:
      - id
      - name
      - username
      - is_public
      - organization_id
      - org_username
      type: object
    SearchDataQuery:
      properties:
        name:
          description: Data name to match exactly.
          type: string
        page:
          description: 1-origin page number. Defaults to 1.
          format: int32
          minimum: 1
          type:
          - integer
          - 'null'
        page_size:
          description: Number of records per page. Defaults to 20 and is capped at 100.
          format: int32
          maximum: 100
          minimum: 1
          type:
          - integer
          - 'null'
      required:
      - name
      type: object
    SearchRepoQuery:
      properties:
        limit:
          format: int64
          type:
          - integer
          - 'null'
        name:
          type:
          - string
          - 'null'
        org:
          description: |-
            Organization username to search in. Defaults to the organization named
            by the `x-operator-id` header.
          type:
          - string
          - 'null'
      type: object
    SignInRequest:
      description: Request body for sign-in endpoint
      properties:
        access_token:
          description: Access token from authentication provider (e.g., Cognito)
          type: string
        allow_sign_up:
          description: |-
            Whether to allow sign up if user doesn't exist.
            If not provided, defaults to None (sign-in only, no auto sign-up).
          type:
          - boolean
          - 'null'
        platform_id:
          description: Platform ID (tenant ID)
          type: string
      required:
      - platform_id
      - access_token
      type: object
    SignInResponse:
      description: Response for sign-in endpoint
      properties:
        user:
          $ref: '#/components/schemas/UserResponse'
      required:
      - user
      type: object
    SourceResponse:
      properties:
        id:
          type: string
        name:
          type: string
        repo_id:
          type: string
        url:
          type:
          - string
          - 'null'
      required:
      - id
      - repo_id
      - name
      type: object
    UpdateDataRequest:
      properties:
        name:
          type: string
        property_data:
          items:
            $ref: '#/components/schemas/PropertyDataRequest'
          type: array
      required:
      - name
      - property_data
      type: object
    UpdateOrganizationRequest:
      properties:
        description:
          type:
          - string
          - 'null'
        name:
          type: string
        website:
          type:
          - string
          - 'null'
      required:
      - name
      type: object
    UpdatePropertyRequest:
      properties:
        name:
          type: string
      required:
      - name
      type: object
    UpdateRepoRequest:
      properties:
        description:
          type:
          - string
          - 'null'
        is_public:
          type:
          - boolean
          - 'null'
        name:
          type:
          - string
          - 'null'
        tags:
          items:
            type: string
          type:
          - array
          - 'null'
      type: object
    UpdateSourceRequest:
      properties:
        name:
          type:
          - string
          - 'null'
        url:
          type:
          - string
          - 'null'
      type: object
    UserResponse:
      description: User information in sign-in response
      properties:
        email:
          type:
          - string
          - 'null'
        id:
          type: string
        name:
          type:
          - string
          - 'null'
        role:
          type: string
        tenants:
          items:
            type: string
          type: array
        username:
          type: string
      required:
      - id
      - username
      - role
      - tenants
      type: object
info:
  description: ''
  license:
    identifier: MIT
    name: MIT
  title: library-api
  version: 1.11.2
openapi: 3.1.0
paths:
  /auth/v1beta/sign-in:
    post:
      description: |-
        This endpoint authenticates a user using an access token from the
        authentication provider (e.g., Cognito) and returns user information.
      operationId: sign_in
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResponse'
          description: User signed in successfully
        '400':
          description: Bad request - invalid input
        '401':
          description: Unauthorized - invalid token
        '404':
          description: User not found and sign up not allowed
        '500':
          description: Internal server error
      summary: Sign in with platform access token.
      tags:
      - auth
  /docs/{org}/{repo}:
    get:
      description: Lists documents in a repo as an HTML page.
      operationId: list_docs
      parameters:
      - description: Organization username
        in: path
        name: org
        required: true
        schema:
          type: string
      - description: Repository username
        in: path
        name: repo
        required: true
        schema:
          type: string
      - description: 1-origin page number. Defaults to 1.
        in: query
        name: page
        required: false
        schema:
          format: int32
          minimum: 1
          type: integer
      - description: Number of documents per page. Defaults to 50 and is capped at 100.
        in: query
        name: page_size
        required: false
        schema:
          format: int32
          maximum: 100
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            text/html:
              schema:
                type: string
          description: Rendered docs list HTML
        '400':
          description: Invalid pagination request
        '403':
          description: Private repository access denied
        '404':
          description: Organization or repository not found
      summary: '`GET /docs/:org/:repo`'
      tags:
      - public-docs
  /docs/{org}/{repo}/{data_id}:
    get:
      description: |-
        Renders a single document as an HTML page with the Markdown body
        converted to HTML via pulldown-cmark.
      operationId: view_doc
      parameters:
      - description: Organization username
        in: path
        name: org
        required: true
        schema:
          type: string
      - description: Repository username
        in: path
        name: repo
        required: true
        schema:
          type: string
      - description: Data ID
        in: path
        name: data_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            text/html:
              schema:
                type: string
          description: Rendered document HTML
        '403':
          description: Private repository access denied
        '404':
          description: Organization, repository, or data not found
      summary: '`GET /docs/:org/:repo/:data_id`'
      tags:
      - public-docs
  /docs/{org}/{repo}/{data_id}/md:
    get:
      description: |-
        Returns the raw composed Markdown (with YAML frontmatter). The
        frontmatter carries `url`, the address of this document in the
        Library client, alongside `id` and `title`.
      operationId: view_doc_markdown
      parameters:
      - description: Organization username
        in: path
        name: org
        required: true
        schema:
          type: string
      - description: Repository username
        in: path
        name: repo
        required: true
        schema:
          type: string
      - description: Data ID
        in: path
        name: data_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            text/markdown:
              schema:
                type: string
          description: Composed Markdown with YAML frontmatter, including the document's `url` in the Library client
        '403':
          description: Private repository access denied
        '404':
          description: Organization, repository, or data not found
      summary: '`GET /docs/:org/:repo/:data_id/md`'
      tags:
      - public-docs
  /health:
    get:
      operationId: health_check
      responses:
        '200':
          description: OK
      tags: []
  /v1beta/global-id-mapping:
    get:
      operationId: get_global_id_mapping
      parameters:
      - description: Source system name (e.g. `bakuure`)
        in: query
        name: system
        required: true
        schema:
          type: string
      - description: Code in the source system (e.g. `BWS-001`)
        in: query
        name: code
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalIdMappingResponse'
          description: Mapping found
        '404':
          description: No mapping for (system, code) in caller's tenant
      tags:
      - global_id_mapping
  /v1beta/orgs:
    post:
      operationId: create_organization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
          description: Organization created
        '400':
          description: Invalid request
        '409':
          description: Organization already exists
      tags: []
  /v1beta/orgs/{org}:
    get:
      operationId: view_organization
      parameters:
      - description: Organization username
        in: path
        name: org
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
          description: Organization found
        '404':
          description: Organization not found
      tags: []
    put:
      operationId: update_organization
      parameters:
      - description: Organization username
        in: path
        name: org
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
          description: Organization updated
        '400':
          description: Invalid request
        '404':
          description: Organization not found
      tags: []
  /v1beta/repos:
    get:
      operationId: search_repo
      parameters:
      - description: Organization username to search in. Defaults to the x-operator-id organization
        in: query
        name: org
        required: false
        schema:
          type: string
      - description: Repository name to search for
        in: query
        name: name
        required: false
        schema:
          type: string
      - description: Maximum number of results to return
        in: query
        name: limit
        required: false
        schema:
          format: int64
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/RepoResponse'
                type: array
          description: Repositories found
      tags: []
  /v1beta/repos/{org}:
    post:
      operationId: create_repo
      parameters:
      - description: Organization username
        in: path
        name: org
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRepoRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoResponse'
          description: Repository created
        '400':
          description: Invalid request
        '409':
          description: Repository already exists
      tags: []
  /v1beta/repos/{org}/{repo}:
    delete:
      operationId: delete_repo
      parameters:
      - description: Organization username
        in: path
        name: org
        required: true
        schema:
          type: string
      - description: Repository username
        in: path
        name: repo
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Repository deleted
        '404':
          description: Repository not found
      tags: []
    get:
      operationId: view_repo
      parameters:
      - description: Organization username
        in: path
        name: org
        required: true
        schema:
          type: string
      - description: Repository username
        in: path
        name: repo
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoResponse'
          description: Repository found
        '404':
          description: Repository not found
      tags: []
    put:
      operationId: update_repo
      parameters:
      - description: Organization username
        in: path
        name: org
        required: true
        schema:
          type: string
      - description: Repository username
        in: path
        name: repo
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRepoRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoResponse'
          description: Repository updated
        '400':
          description: Invalid request
        '404':
          description: Repository not found
      tags: []
  /v1beta/repos/{org}/{repo}/change-username:
    put:
      operationId: change_repo_username
      parameters:
      - description: Organization username
        in: path
        name: org
        required: true
        schema:
          type: string
      - description: Current repository username
        in: path
        name: repo
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRepoUsernameRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepoResponse'
          description: Repository username changed
        '400':
          description: Invalid request
        '404':
          description: Repository not found
        '409':
          description: Repository with new username already exists
      tags: []
  /v1beta/repos/{org}/{repo}/data:
    get:
      operationId: search_data
      parameters:
      - description: Organization username
        in: path
        name: org
        required: true
        schema:
          type: string
      - description: Repository username
        in: path
        name: repo
        required: true
        schema:
          type: string
      - description: Data name to match exactly.
        in: query
        name: name
        required: true
        schema:
          type: string
      - description: 1-origin page number. Defaults to 1.
        in: query
        name: page
        required: false
        schema:
          format: int32
          minimum: 1
          type: integer
      - description: Number of records per page. Defaults to 20 and is capped at 100.
        in: query
        name: page_size
        required: false
        schema:
          format: int32
          maximum: 100
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataListResponse'
          description: Data found
        '400':
          description: Invalid pagination request
        '404':
          description: Repository not found
      tags: []
    post:
      operationId: add_data
      parameters:
      - description: Organization username
        in: path
        name: org
        required: true
        schema:
          type: string
      - description: Repository username
        in: path
        name: repo
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDataRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataResponse'
          description: Data created
        '400':
          description: Invalid request
        '404':
          description: Repository not found
      tags: []
  /v1beta/repos/{org}/{repo}/data-list:
    get:
      operationId: view_data_list
      parameters:
      - description: Organization username
        in: path
        name: org
        required: true
        schema:
          type: string
      - description: Repository username
        in: path
        name: repo
        required: true
        schema:
          type: string
      - description: |-
          1-origin page number. The legacy `offset` alias is also interpreted as
          a page number and therefore must be at least 1.
        in: query
        name: page
        required: false
        schema:
          format: int32
          minimum: 1
          type: integer
      - description: Number of records per page. The legacy `limit` alias remains accepted.
        in: query
        name: page_size
        required: false
        schema:
          format: int32
          maximum: 100
          minimum: 1
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataListResponse'
          description: Data list found
        '400':
          description: Invalid pagination request
        '404':
          description: Repository not found
      tags: []
  /v1beta/repos/{org}/{repo}/data/parquet:
    get:
      operationId: view_data_parquet
      parameters:
      - description: Organization username
        in: path
        name: org
        required: true
        schema:
          type: string
      - description: Repository username
