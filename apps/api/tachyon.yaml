apiVersion: tachyon/v1
kind: CloudApp
metadata:
  name: library-api
  tenant_id: tn_01j702qf86pc2j35s0kv0gv3gy
spec:
  framework: cargo_lambda
  deploymentTarget: lambda
  tier: enterprise
  subnet: enterprise-library
  rootDirectory: apps/api
  dockerContext: .
  repository:
    owner: quantum-box
    name: library
    url: https://github.com/quantum-box/library
    defaultBranch: main
  build:
    package: library-api
    binary: lambda-library-api
    installCommand: apt-get update && apt-get install -y --no-install-recommends protobuf-compiler && pip3 install cargo-lambda && rustup target add aarch64-unknown-linux-gnu
    command: cargo lambda build --package library-api --bin lambda-library-api --release --arm64 --lambda-dir target/lambda/lambda-library-api --flatten lambda-library-api
    release: true
    arch: arm64
  envVars:
    - name: DATABASE_URL
      valueFrom:
        secret: library-api/DATABASE_URL
    - name: SERVICE_AUTH_TOKEN
      valueFrom:
        secret: library-api/SERVICE_AUTH_TOKEN
    - name: COGNITO_JWK_URL
      value: "https://cognito-idp.ap-northeast-1.amazonaws.com/ap-northeast-1_8Ga4bK5M4/.well-known/jwks.json"
    - name: COGNITO_USER_POOL_ID
      value: "ap-northeast-1_8Ga4bK5M4"
    - name: TACHYON_API_URL
      value: "https://api.n1.tachy.one"
    - name: LIBRARY_PARQUET_BUCKET
      value: "tachyon-library-parquet-production"
    - name: DB_POOL_MAX_CONNECTIONS
      value: "16"
    - name: DB_POOL_ACQUIRE_TIMEOUT_SECS
      value: "10"
    - name: DB_POOL_ACQUIRE_METRICS_ENABLED
      value: "true"
    - name: DB_POOL_ACQUIRE_METRICS_INTERVAL_SECS
      value: "60"
    - name: DB_POOL_ACQUIRE_WARN_MS
      value: "250"
    - name: ENVIRONMENT
      value: "production"
