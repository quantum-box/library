[workspace]
members = ["common", "public-docs", "sync"]
resolver = "2"

[workspace.dependencies]
worker = "=0.8.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["AbortSignal", "Crypto", "WorkerGlobalScope"] }
futures = "0.3"
percent-encoding = "2"
regex = "1"
base64 = "0.22"
sha2 = "0.10"
library-worker-common = { path = "common" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
