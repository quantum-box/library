[package]
name = "library-client"
version = "0.1.0"
description = "Library knowledge workspace for web, desktop, and mobile"
authors = ["Quantum Box"]
license = "MIT"
repository = "https://github.com/quantum-box/library"
edition = "2021"
rust-version = "1.88.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "library_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["unstable"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# `ios_webview` reaches into UIKit to give the WebView the whole screen; see
# that module for why Tauri leaves it short of the bottom without this.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-ui-kit = { version = "0.3", features = ["std", "UIResponder", "UIScrollView", "UIView"] }
