[package]
name = "library-client"
version = "0.1.0"
description = "Library knowledge workspace for web, desktop, and mobile"
authors = ["Quantum Box"]
license = "MIT"
repository = "https://github.com/quantum-box/library"
edition = "2021"
rust-version = "1.88.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "library_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
photon-engine = { path = "../packages/photon-engine", default-features = false }
