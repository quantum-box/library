<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title">
  <title id="title">Library adaptive icon foreground</title>
  <!--
    The mark from src/assets/brand/library-logo/badge-dark.svg without its
    plate. The navy strokes are the separators the mark is drawn with; they
    disappear into the background layer, which is the same navy.

    The mark fills 77% of its own canvas, and an adaptive layer only guarantees
    the middle 61% (66 of 108dp), so it is scaled to land inside that. Doing it
    here rather than through the manifest's `android_fg_scale`, which the CLI
    did not apply.
  -->
  <g transform="translate(512 512) scale(0.78) translate(-512 -512)">
    <circle cx="512" cy="512" r="300" fill="none" stroke="#fff" stroke-width="96"/>
    <path d="M235 700C430 690 700 610 835 335" fill="none" stroke="#07172f" stroke-linecap="round" stroke-width="126"/>
    <path d="M235 700C430 690 700 610 835 335" fill="none" stroke="#4d7cff" stroke-linecap="round" stroke-width="86"/>
    <circle cx="235" cy="700" r="94" fill="#07172f"/>
    <circle cx="235" cy="700" r="78" fill="#4d7cff"/>
    <circle cx="835" cy="335" r="94" fill="#07172f"/>
    <circle cx="835" cy="335" r="78" fill="#4d7cff"/>
  </g>
</svg>
