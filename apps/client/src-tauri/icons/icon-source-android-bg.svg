<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title">
  <title id="title">Library adaptive icon background</title>
  <!-- Android composites this behind the foreground and crops it to whatever
       shape the launcher uses, so it stays a flat brand-navy field. -->
  <rect width="1024" height="1024" fill="#07172f"/>
</svg>
