apiVersion: apps.tachy.one/v1alpha
kind: CloudApps
metadata:
  name: library
  tenantId: tn_01j702qf86pc2j35s0kv0gv3gy
spec:
  apps:
    - name: library-api
      repository:
        owner: quantum-box
        name: library
        url: https://github.com/quantum-box/library
        defaultBranch: main
      framework: cargo_lambda
      deploymentTarget: lambda
      tier: enterprise
      subnet: enterprise-library
      rootDirectory: apps/api
      dockerContext: .
      build:
        package: library-api
        binary: lambda-library-api
        installCommand: if ! command -v protoc >/dev/null 2>&1; then if command -v yum >/dev/null 2>&1; then yum install -y protobuf-compiler; elif command -v dnf >/dev/null 2>&1; then dnf install -y protobuf-compiler; elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y --no-install-recommends protobuf-compiler; else echo "No supported package manager for protoc"; exit 1; fi; fi && pip3 install --force-reinstall cargo-lambda==1.9.1 ziglang==0.15.2 && rustup toolchain install nightly-2026-06-04 && rustup target add aarch64-unknown-linux-gnu --toolchain nightly-2026-06-04
        command: >-
          bash -lc 'source "$HOME/.cargo/env";
          (while true; do sleep 60; echo "cargo lambda build still running..."; done) &
          HEARTBEAT_PID=$!;
          trap '\''kill "$HEARTBEAT_PID" 2>/dev/null || true'\'' EXIT;
          SQLX_OFFLINE=true cargo +nightly-2026-06-04 lambda build --package library-api --bin lambda-library-api --release --arm64 --lambda-dir target/lambda/lambda-library-api --flatten lambda-library-api;
          BUILD_STATUS=$?;
          kill "$HEARTBEAT_PID" 2>/dev/null || true;
          wait "$HEARTBEAT_PID" 2>/dev/null || true;
          if [ "$BUILD_STATUS" -ne 0 ]; then exit "$BUILD_STATUS"; fi;
          mkdir -p ../../target/lambda/lambda-library-api &&
          cp target/lambda/lambda-library-api/bootstrap ../../target/lambda/lambda-library-api/bootstrap'
        release: true
        arch: arm64
      envVars:
        - name: DATABASE_URL
          type: credential
          valueFrom:
            secret: library-api/DATABASE_URL
        - name: SERVICE_AUTH_TOKEN
          type: credential
          valueFrom:
            secret: library-api/SERVICE_AUTH_TOKEN
        - name: COGNITO_JWK_URL
          value: "https://cognito-idp.ap-northeast-1.amazonaws.com/ap-northeast-1_8Ga4bK5M4/.well-known/jwks.json"
        - name: COGNITO_USER_POOL_ID
          value: "ap-northeast-1_8Ga4bK5M4"
        - name: TACHYON_API_URL
          value: "https://api.n1.tachy.one"
        - name: LIBRARY_PARQUET_BUCKET
          value: "tachyon-library-parquet-production"
        - name: SENTRY_DSN
          type: credential
          valueFrom:
            secret: library-api/SENTRY_DSN
        - name: OTEL_EXPORTER_OTLP_HEADERS
          type: credential
          valueFrom:
            secret: library-api/OTEL_EXPORTER_OTLP_HEADERS
        - name: DB_POOL_MAX_CONNECTIONS
          value: "16"
        - name: DB_POOL_ACQUIRE_TIMEOUT_SECS
          value: "10"
        - name: DB_POOL_ACQUIRE_METRICS_ENABLED
          value: "true"
        - name: DB_POOL_ACQUIRE_METRICS_INTERVAL_SECS
          value: "60"
        - name: DB_POOL_ACQUIRE_WARN_MS
          value: "250"
        - name: ENVIRONMENT
          value: "production"
        - name: RUST_BACKTRACE
          value: "1"
        - name: OTEL_ENABLED
          value: "true"
        - name: OTEL_SERVICE_NAME
          value: "library-api"
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "http/protobuf"
        - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
          type: credential
          valueFrom:
            secret: library-api/OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "deployment.environment=production,service.namespace=library"
        - name: OTEL_TRACES_SAMPLER_ARG
          value: "0.05"
        - name: OTEL_PROPAGATORS
          value: "tracecontext"
    - name: library-api-migrate
      repository:
        owner: quantum-box
        name: library
        url: https://github.com/quantum-box/library
        defaultBranch: main
      framework: cargo_lambda
      deploymentTarget: lambda
      tier: enterprise
      subnet: enterprise-library
      rootDirectory: apps/api
      dockerContext: .
      watchPaths:
        - apps/api/migrations/**
        - apps/api/src/migrations.rs
        - apps/api/bin/migrate.rs
      build:
        package: library-api
        binary: library_api_migrate
        installCommand: if ! command -v protoc >/dev/null 2>&1; then if command -v yum >/dev/null 2>&1; then yum install -y protobuf-compiler; elif command -v dnf >/dev/null 2>&1; then dnf install -y protobuf-compiler; elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y --no-install-recommends protobuf-compiler; else echo "No supported package manager for protoc"; exit 1; fi; fi && pip3 install --force-reinstall cargo-lambda==1.9.1 ziglang==0.15.2 && rustup toolchain install nightly-2026-06-04 && rustup target add aarch64-unknown-linux-gnu --toolchain nightly-2026-06-04
        command: >-
          bash -lc 'source "$HOME/.cargo/env";
          SQLX_OFFLINE=true cargo +nightly-2026-06-04 lambda build --package library-api --bin library_api_migrate --release --arm64 --lambda-dir target/lambda/library_api_migrate;
          mkdir -p target/lambda/library_api_migrate;
          if [ ! -f target/lambda/library_api_migrate/bootstrap ]; then
            for CAND in target/lambda/library_api_migrate/bootstrap ../../target/lambda/library_api_migrate/bootstrap; do
              if [ -f "$CAND" ]; then cp "$CAND" target/lambda/library_api_migrate/bootstrap; break; fi;
            done;
          fi;
          if [ ! -f target/lambda/library_api_migrate/bootstrap ]; then
            BIN=$(find target ../../target -path "*/aarch64-unknown-linux-gnu/release/library_api_migrate" -type f 2>/dev/null | head -1);
            if [ -z "$BIN" ]; then BIN=$(find target ../../target -path "*/release/library_api_migrate" -type f 2>/dev/null | head -1); fi;
            if [ -z "$BIN" ]; then echo "ERROR: library_api_migrate bootstrap/binary not found"; find target ../../target -name library_api_migrate 2>/dev/null | head -20; exit 1; fi;
            cp "$BIN" target/lambda/library_api_migrate/bootstrap;
            chmod +x target/lambda/library_api_migrate/bootstrap;
          fi;
          mkdir -p ../../target/lambda/library_api_migrate &&
          cp target/lambda/library_api_migrate/bootstrap ../../target/lambda/library_api_migrate/bootstrap'
        release: true
        arch: arm64
      envVars:
        - name: DATABASE_URL
          type: credential
          valueFrom:
            secret: library-api/DATABASE_URL
        - name: ENVIRONMENT
          value: "production"
        - name: RUST_LOG
          value: "info"
        - name: RUST_BACKTRACE
          value: "1"
    - name: planet-library
      repository:
        url: https://github.com/quantum-box/library
        owner: quantum-box
        name: library
        defaultBranch: main
      rootDirectory: apps/web
      watchPaths:
        - apps/web/**
      framework: vite
      deploymentTarget: cloudflare_pages
      integrations:
        sentry:
          project: nextjs
      build:
        installCommand: yarn install --immutable
        command: yarn build
        outputDirectory: dist
        nodeVersion: "20"
      envVars:
        - name: VITE_BACKEND_API_URL
          valueFrom:
            computeDeploymentRef:
              appName: library-api
              field: publicUrl
        - name: VITE_COGNITO_CLIENT_ID
          valueFrom:
            secret:
              path: cognito/client_id
        - name: VITE_COGNITO_REGION
          value: ap-northeast-1
        - name: VITE_PLATFORM_ID
          value: tn_01j702qf86pc2j35s0kv0gv3gy
        - name: VITE_COGNITO_USER_POOL_ID
          value: ap-northeast-1_8Ga4bK5M4
