apiVersion: apps.tachy.one/v1alpha
kind: CloudApps
metadata:
  name: library
  tenantId: tn_01j91h09tpj5ehwbwfwfxpak2b
spec:
  apps:
    - name: library-api
      repository:
        owner: quantum-box
        name: library
        url: https://github.com/quantum-box/library
        defaultBranch: main
      framework: cargo_lambda
      deploymentTarget: lambda
      tier: enterprise
      subnet: enterprise-library
      rootDirectory: apps/api
      dockerContext: .
      build:
        package: library-api
        binary: lambda-library-api
        installCommand: if ! command -v protoc >/dev/null 2>&1; then if command -v yum >/dev/null 2>&1; then yum install -y protobuf-compiler; elif command -v dnf >/dev/null 2>&1; then dnf install -y protobuf-compiler; elif command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y --no-install-recommends protobuf-compiler; else echo "No supported package manager for protoc"; exit 1; fi; fi && PIP_BREAK_SYSTEM_PACKAGES=1 pip3 install --force-reinstall cargo-lambda==1.9.1 ziglang==0.15.2 && rustup toolchain install nightly-2026-06-04 --no-self-update && rustup target add aarch64-unknown-linux-gnu --toolchain nightly-2026-06-04
        command: >-
          bash -lc 'source "$HOME/.cargo/env";
          LAMBDA_ARTIFACT_DIR="${CARGO_TARGET_DIR:-$(git rev-parse --show-toplevel)/target}/lambda/lambda-library-api";
          (while true; do sleep 60; echo "cargo lambda build still running..."; done) &
          HEARTBEAT_PID=$!;
          trap '\''kill "$HEARTBEAT_PID" 2>/dev/null || true'\'' EXIT;
          SQLX_OFFLINE=true cargo +nightly-2026-06-04 lambda build --package library-api --bin lambda-library-api --release --arm64 --lambda-dir "$LAMBDA_ARTIFACT_DIR" --flatten lambda-library-api;
          BUILD_STATUS=$?;
          kill "$HEARTBEAT_PID" 2>/dev/null || true;
          wait "$HEARTBEAT_PID" 2>/dev/null || true;
          if [ "$BUILD_STATUS" -ne 0 ]; then exit "$BUILD_STATUS"; fi'
        release: true
        arch: arm64
      environments:
        preview:
          # ADR-0049 provisions one isolated database and scoped user per PR.
          # Production keeps its existing databaseRef and migration hook below.
          provisionedDatabase:
            provider: tidb
            engine: mysql
            envVar: DATABASE_URL
            migration:
              # PLT-3561: the per-PR TiDB is PrivateLink-only, so the
              # deploy-hook runner has no route to it and a `command`
              # migration can only time out. Run the migration as a Lambda
              # inside the enterprise-library network instead; the platform
              # injects the resolved per-PR connection URL into the invoke
              # payload (databaseUrl / databaseUrlEnv).
              #
              # `qualifier: prod` pins the invoke to the migrate app's
              # production alias. Without it the hook would reach $LATEST,
              # which any PR's preview build of that app overwrites, so one
              # PR's migrations could land in another PR's database.
              lambdaInvoke:
                appName: library-api-preview-migrate
                qualifier: prod
              timeoutSeconds: 900
        production:
          hooks:
            preDeploy:
              - name: migrate
                lambdaInvoke:
                  functionName: lambda-library-api-migrate
                  payload:
                    task: migrate
                timeoutSeconds: 900
      envVars:
        - name: DATABASE_URL
          type: credential
          valueFrom:
            databaseRef:
              name: tidb_library_api_prod
              field: url
        - name: SERVICE_AUTH_TOKEN
          type: credential
          valueFrom:
            secret: library-api/SERVICE_AUTH_TOKEN
        - name: COGNITO_JWK_URL
          value: "https://cognito-idp.ap-northeast-1.amazonaws.com/ap-northeast-1_8Ga4bK5M4/.well-known/jwks.json"
        - name: COGNITO_USER_POOL_ID
          value: "ap-northeast-1_8Ga4bK5M4"
        - name: TACHYON_API_URL
          value: "https://api.n1.tachy.one"
        - name: LIBRARY_API_BASE_URL
          value: "https://library-api.txcloud.app"
        - name: LIBRARY_TENANT_ID
          value: "tn_01j91h09tpj5ehwbwfwfxpak2b"
        # Applied id of the library:org-creator custom policy
        # (.tachyon/manifests/library-api-runtime.yml). Attached to
        # users at sign-in so organization creation, which tachyon-api
        # authorizes as the caller, can pass auth:CreateOperator.
        - name: LIBRARY_ORG_CREATOR_POLICY_ID
          value: "pol_01m0cdez8p62f0a8dz3tzsqzey"
        - name: LIBRARY_PARQUET_BUCKET
          value: "tachyon-library-parquet-production"
        - name: SENTRY_DSN
          type: credential
          valueFrom:
            secret: library-api/SENTRY_DSN
        - name: DB_POOL_MAX_CONNECTIONS
          value: "16"
        - name: DB_POOL_ACQUIRE_TIMEOUT_SECS
          value: "10"
        - name: DB_POOL_ACQUIRE_METRICS_ENABLED
          value: "true"
        - name: DB_POOL_ACQUIRE_METRICS_INTERVAL_SECS
          value: "60"
        - name: DB_POOL_ACQUIRE_WARN_MS
          value: "250"
        - name: ENVIRONMENT
          value: "production"
        - name: RUST_BACKTRACE
          value: "1"
        - name: OTEL_ENABLED
          value: "true"
        - name: OTEL_SERVICE_NAME
          value: "library-api"
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "http/protobuf"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "deployment.environment=production,service.namespace=library"
        - name: OTEL_TRACES_SAMPLER_ARG
          value: "0.05"
        - name: OTEL_PROPAGATORS
          value: "tracecontext"
    # Preview-database migration runner (PLT-3561). Declared as a Cloud App
    # rather than hand-rolled infrastructure so the platform builds it from
    # this repository and deploys it into the enterprise-library subnet,
    # whose security group already has 4000/tcp egress to the user TiDB
    # endpoint. `library-api`'s preview migration hook invokes it by
    # appName; the resulting function is `lambda-library-api-preview-migrate`.
    - name: library-api-preview-migrate
      repository:
        owner: quantum-box
        name: library
        url: https://github.com/quantum-box/library
        defaultBranch: main
      framework: cargo_lambda
      deploymentTarget: lambda
      tier: enterprise
      subnet: enterprise-library
      rootDirectory: packages/preview_migrate
      dockerContext: .
      watchPaths:
        - packages/preview_migrate/**
        - apps/api/migrations/**
        - packages/database-manager/migrations/**
        - scripts/build-library-api-preview-migrate-lambda.sh
      build:
        package: library-api-preview-migrate
        binary: lambda-library-api-preview-migrate
        # The migration crate depends on sqlx and lambda_runtime only, so
        # unlike library-api this build needs no protoc.
        installCommand: >-
          PIP_BREAK_SYSTEM_PACKAGES=1 pip3 install --force-reinstall
          cargo-lambda==1.9.1 ziglang==0.15.2 &&
          rustup toolchain install nightly-2026-06-04 --no-self-update &&
          rustup target add aarch64-unknown-linux-gnu --toolchain nightly-2026-06-04
        command: >-
          bash -lc 'bash ../../scripts/build-library-api-preview-migrate-lambda.sh'
        release: true
        arch: arm64
      envVars:
        # The binary refuses to run against anything but a pr_-scoped
        # database, and asserts its own environment rather than trusting the
        # invoke payload. This app exists only to migrate preview databases.
        - name: ENVIRONMENT
          value: "preview"
        - name: RUST_LOG
          value: "info"
        - name: RUST_BACKTRACE
          value: "1"
    - name: planet-library
      repository:
        url: https://github.com/quantum-box/library
        owner: quantum-box
        name: library
        defaultBranch: main
      rootDirectory: apps/web
      watchPaths:
        - apps/web/**
      framework: vite
      deploymentTarget: cloudflare_pages
      build:
        installCommand: yarn install --immutable
        command: yarn build
        outputDirectory: dist
        nodeVersion: "20"
      envVars:
        - name: VITE_BACKEND_API_URL
          value: https://library-api.txcloud.app
        - name: VITE_COGNITO_CLIENT_ID
          value: 5b0a8ncbi6v189p3un146fb6rf
        - name: VITE_COGNITO_REGION
          value: ap-northeast-1
        - name: VITE_PLATFORM_ID
          value: tn_01j91h09tpj5ehwbwfwfxpak2b
        - name: VITE_COGNITO_USER_POOL_ID
          value: ap-northeast-1_8Ga4bK5M4
    - name: library-client
      repository:
        url: https://github.com/quantum-box/library
        owner: quantum-box
        name: library
        defaultBranch: main
      rootDirectory: apps/client
      watchPaths:
        - apps/client/**
      framework: vite
      deploymentTarget: cloudflare_pages
      build:
        installCommand: >-
          npm ci --ignore-scripts
        command: npm run build:cloud
        outputDirectory: dist
        nodeVersion: "22"
      envVars:
        - name: VITE_LIBRARY_DEPLOYMENT_MODE
          value: cloud
        - name: VITE_LIBRARY_SYNC_BACKEND
          value: cloudflare-durable-object
        - name: VITE_LIBRARY_SYNC_WS_URL
          value: wss://photon-sync.quantum-box.workers.dev/ws
        - name: VITE_LIBRARY_CHAT_STREAM_MODE
          value: mock
        - name: VITE_LIBRARY_API_BASE_URL
          value: https://library-api.txcloud.app
        - name: VITE_LIBRARY_PLATFORM_ID
          value: tn_01j91h09tpj5ehwbwfwfxpak2b
        - name: VITE_COGNITO_CLIENT_ID
          value: 5b0a8ncbi6v189p3un146fb6rf
        - name: VITE_COGNITO_REGION
          value: ap-northeast-1
