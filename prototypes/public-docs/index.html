width:36px;border-right:1px solid #edf0f6}.mini-sidebar i{display:block;width:24px;height:4px;background:#e4eaf5;margin-bottom:9px;border-radius:2px}.mini-grid{flex:1}.mini-grid b{font-size:8px;display:block;margin-bottom:10px}.mini-row{display:flex;gap:5px}.mini-row i{background:#f0f4ff;height:28px;border-radius:3px;flex:1}.mini-lines{height:3px;width:90%;background:#ebeff7;box-shadow:0 9px #ebeff7,0 18px #ebeff7;margin-top:11px}h2{font-size:20px;letter-spacing:-.4px;line-height:1.5;margin:34px 0 14px;scroll-margin-top:105px}h3{font-size:14px;line-height:1.7;margin:0 0 5px}p,li{font-size:13px;line-height:1.95;color:#667389}article>p{margin:10px 0 20px}.link-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.article-card{border:1px solid var(--line);border-radius:8px;padding:20px;display:flex;gap:14px;transition:border-color .15s,background .15s}.article-card:hover{border-color:#a6bbed;background:#fafbff}.card-icon{color:#5378da;background:#f1f5fd;border-radius:6px;width:31px;height:31px;display:grid;place-items:center;flex-shrink:0;font-size:17px}.article-card p{font-size:11px;line-height:1.8;margin:0}.article-card h3{font-size:12px}.arrow{color:#a2adbd;margin-left:auto;font-size:17px}.callout{padding:16px 18px;border:1px solid #dfE8fa;background:#f7f9ff;border-radius:7px;display:flex;gap:12px;margin-top:22px}.callout b{color:#426de0;font-size:15px}.callout p{font-size:12px;margin:0}.callout strong{display:block;color:#415270;font-weight:600;margin-bottom:3px}.steps{padding-left:24px}.steps li{padding:7px 0 7px 6px}.pager{border-top:1px solid var(--line);padding-top:26px;margin-top:40px;display:flex;gap:15px}.pager a{border:1px solid var(--line);border-radius:7px;padding:15px 18px;flex:1;display:flex;align-items:center;gap:12px}.pager a:last-child{text-align:right;justify-content:flex-end}.pager small{font-size:10px;color:#8a94a4;display:block;margin-bottom:5px}.pager strong{font-size:12px;font-weight:550}.foot{margin-top:25px;display:flex;justify-content:space-between;font-size:10px;color:#929cac}.toc{padding:51px 24px 20px 15px;position:sticky;top:76px;align-self:start;font-size:11px}.toc-title{font-weight:600;color:#58677f;margin:0 0 17px}.toc a{display:block;padding:9px 0 9px 14px;border-left:1px solid #e5eaf2;color:#8691a3;line-height:1.6}.toc a:hover,.toc a.current{color:#315fdd;border-color:#315fdd}.toc-note{margin-top:30px;border-top:1px solid var(--line);padding-top:18px;color:#909bad;font-size:10px;line-height:1.9}.menu{display:none;background:none;border:0;font-size:21px;color:#657185}.empty{font-size:12px;color:#7a869a;padding:18px 10px}.mobile-close{display:none}footer{padding-top:3px}svg{display:block}html{scroll-behavior:smooth}@media(min-width:1450px){.content{padding-left:72px;padding-right:72px}}@media(max-width:1150px){.layout{grid-template-columns:240px minmax(0,1fr)}.toc{display:none}.content{padding:38px}.sidebar{padding-left:18px;padding-right:18px}}@media(max-width:720px){header{height:64px;padding:0 18px;gap:9px}.header-right .badge,.guide,.divider{display:none}.header-right{gap:12px}.brand{font-size:16px}.menu{display:block}.layout{display:block}.sidebar{display:none;position:fixed;top:64px;left:0;bottom:0;height:calc(100dvh - 64px);width:285px;z-index:10;box-shadow:30px 0 0 100vw #17243b55}.sidebar.open{display:flex}.content{padding:28px 23px}.breadcrumb{margin-bottom:23px}h1{font-size:28px}.lead{font-size:13px}.intro-art{height:160px;padding:22px}.art-copy{max-width:150px}.art-copy strong{font-size:16px}.mini-app{right:-60px;top:42px;width:185px;opacity:.8}.orbit{right:-130px}.link-grid{grid-template-columns:1fr}.article-card{padding:17px}.foot{gap:12px;line-height:1.7}.header-right{font-size:11px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}

<body><header><button class="menu" aria-label="記事メニューを開く" aria-expanded="false">☰</button><a href="#welcome" class="mark" aria-label="TachyonField 利用ガイド ホーム">ϟ</a><a href="#welcome" class="brand">TachyonField</a><span class="divider"></span><span class="guide">利用ガイド</span><div class="header-right"><span class="badge">日本語</span><span>ドキュメント</span></div></header>
<div class="layout"><aside class="sidebar"><label class="search"><span aria-hidden="true">⌕</span><input type="search" placeholder="ドキュメントを検索" aria-label="ドキュメントを検索"><kbd>⌘ K</kbd></label><nav class="nav" aria-label="記事一覧"></nav><footer class="powered"><span>▥</span> Published with <strong>Library</strong></footer></aside><main class="content" id="main"></main><aside class="toc" aria-label="このページの目次"></aside></div>
<script>
const articles=[
{id:'welcome',group:'はじめに',icon:'⌂',title:'TachyonFieldへようこそ',description:'はじめての方に向けて、ガイドの読み方と基本的な操作の流れをご案内します。',sections:[['about','このガイドについて'],['start','まずはここから'],['guide','目的から探す']]},
{id:'quickstart',group:'はじめに',icon:'ϟ',title:'クイックスタート',description:'最初の操作を、一つずつ。基本的な流れを確認しましょう。',sections:[['before','はじめる前に'],['flow','操作の流れ'],['next','次のステップ']]},
{id:'workspace',group:'はじめに',icon:'▦',title:'ワークスペースの基本',description:'作業する場所と、画面の見方を知りましょう。',sections:[['overview','ワークスペースとは'],['check','作業前の確認'],['next','次のステップ']]},
{id:'customers',group:'基本操作',icon:'♙',title:'顧客を管理する',description:'顧客情報を確認し、日々の業務で参照するためのガイドです。',sections:[['overview','顧客情報を確認する'],['check','登録前に確認すること'],['next','次のステップ']]},
{id:'products',group:'基本操作',icon:'◇',title:'商品・サービスを管理する',description:'提供する商品やサービスの情報を整理します。',sections:[['overview','商品情報を確認する'],['check','内容を整理する'],['next','次のステップ']]},
{id:'reservations',group:'基本操作',icon:'▣',title:'予約を確認する',description:'予約の内容を確認する際の、基本的なポイントをまとめています。',sections:[['overview','予約情報を見る'],['check','確認するポイント'],['next','次のステップ']]},
{id:'members',group:'設定と管理',icon:'♧',title:'メンバーと権限',description:'メンバーごとに必要な操作と、アクセス範囲を整理します。',sections:[['overview','権限の考え方'],['check','設定前の確認'],['next','次のステップ']]},
{id:'faq',group:'サポート',icon:'?',title:'よくある質問',description:'操作中に迷ったときは、こちらをご確認ください。',sections:[['access','必要な画面が見つかりません'],['data','情報が見つかりません'],['help','解決しないときは']]}
];
const main=document.querySelector('main'),nav=document.querySelector('.nav'),toc=document.querySelector('.toc'),input=document.querySelector('input'),sidebar=document.querySelector('.sidebar'),menu=document.querySelector('.menu');
let current='welcome';
const callout='<div class="callout"><b>ⓘ</b><p><strong>このページはUIプレビューです</strong>記事は表示確認用のサンプルです。実際の操作手順や機能の提供状況を示すものではありません。</p></div>';
function card(id,description){const a=articles.find(a=>a.id===id);return `<a class="article-card" href="#${id}"><span class="card-icon">${a.icon}</span><div><h3>${a.title}</h3><p>${description}</p></div><span class="arrow">›</span></a>`}
function renderNav(){let group='';const q=input.value.trim().toLocaleLowerCase();const matches=articles.filter(a=>(a.title+' '+a.description+' '+a.group).toLocaleLowerCase().includes(q));nav.innerHTML=matches.map(a=>{let label='';if(group!==a.group){group=a.group;label=`<div class="group-label">${group}</div>`}return label+`<a href="#${a.id}" class="${a.id===current?'active':''}" ${a.id===current?'aria-current="page"':''}><span class="nav-icon" aria-hidden="true">${a.icon}</span>${a.title}</a>`}).join('')||'<p class="empty">一致する記事がありません。<br>別のキーワードで検索してください。</p>'}
function render(){const id=location.hash.slice(1).split('/')[0]||'welcome';const a=articles.find(a=>a.id===id);if(!a){main.innerHTML='<h1>記事が見つかりません</h1><p><a href="#welcome">ガイドのトップへ戻る</a></p>';toc.innerHTML='';return}current=a.id;document.title=a.title+' · TachyonField 利用ガイド';renderNav();let body='';
if(id==='welcome'){body=`<div class="intro-art" aria-hidden="true"><div class="art-copy"><strong>日々の業務を、<br>ひとつの場所から。</strong><p>TachyonFieldの使い方を<br>ここから見つけましょう。</p></div><div class="orbit"></div><div class="mini-app"><div class="mini-top"><span class="tiny-logo"></span>TachyonField</div><div class="mini-body"><div class="mini-sidebar"><i></i><i></i><i></i><i></i></div><div class="mini-grid"><b>ワークスペース</b><div class="mini-row"><i></i><i></i><i></i></div><div class="mini-lines"></div></div></div></div></div><h2 id="about">このガイドについて</h2><p>TachyonFieldを使い始める方も、使い方を確認したい方も。<br>基本操作から設定まで、知りたいことに合わせて読み進められます。</p><h2 id="start">まずはここから</h2><p>初めて利用する方は、クイックスタートからご覧ください。</p><div class="link-grid">${card('quickstart','最初の操作の流れをつかむ')}${card('workspace','画面の構成と基本を知る')}</div><h2 id="guide">目的から探す</h2><div class="link-grid">${card('customers','顧客情報を確認・整理する')}${card('products','商品やサービスの情報を整理する')}${card('reservations','予約の内容を確認する')}${card('members','アクセス範囲を確認する')}</div>${callout}`}
else if(id==='faq'){body='<h2 id="access">必要な画面が見つかりません</h2><p>選択しているワークスペースと、ご自身のアクセス権限を管理者に確認してください。</p><h2 id="data">情報が見つかりません</h2><p>検索条件や表示の絞り込みが残っていないかを確認しましょう。</p><h2 id="help">解決しないときは</h2><p>開いている画面名と、どの操作で困っているかをまとめて、ワークスペースの管理者に相談してください。</p>'+callout}
else{body=`<h2 id="${a.sections[0][0]}">${a.sections[0][1]}</h2><p>${a.description} このサンプルでは、実際のデータを変更せずにガイドの読み進め方を確認できます。</p><h2 id="${a.sections[1][0]}">${a.sections[1][1]}</h2><ol class="steps"><li>対象のワークスペースが正しいことを確認します。</li><li>必要な情報を探し、内容を確認します。</li><li>不明な点があれば、管理者に確認します。</li></ol>${callout}<h2 id="next">次のステップ</h2><p>関連するガイドもあわせてご覧ください。</p><div class="link-grid">${card('welcome','ガイドの全体像を見る')}${card('faq','困ったときの確認ポイント')}</div>`}
const index=articles.indexOf(a),prev=articles[index-1],next=articles[index+1];
main.innerHTML=`<div class="breadcrumb"><a href="#welcome">利用ガイド</a><span>›</span><span>${a.group}</span></div><article><h1>${a.title}</h1><p class="lead">${a.description}</p>${body}</article><nav class="pager" aria-label="前後の記事">${prev?`<a href="#${prev.id}"><span>‹</span><div><small>前の記事</small><strong>${prev.title}</strong></div></a>`:''}${next?`<a href="#${next.id}"><div><small>次の記事</small><strong>${next.title}</strong></div><span>›</span></a>`:''}</nav><div class="foot"><span>公開ドキュメント · 閲覧専用</span><span>TachyonField 利用ガイド</span></div>`;
toc.innerHTML='<div class="toc-title">このページの内容</div>'+a.sections.map((s,i)=>`<a href="#${a.id}/${s[0]}" class="${i===0?'current':''}">${s[1]}</a>`).join('')+'<div class="toc-note">いつでも、必要なところから。<br>目次や検索で記事を探せます。</div>';
sidebar.classList.remove('open');menu.setAttribute('aria-expanded','false');const anchor=location.hash.split('/')[1];if(anchor){requestAnimationFrame(()=>document.getElementById(anchor)?.scrollIntoView());toc.querySelectorAll('a').forEach(el=>el.classList.toggle('current',el.hash===location.hash))}else window.scrollTo(0,0);
}
input.addEventListener('input',renderNav);window.addEventListener('hashchange',render);menu.addEventListener('click',()=>{const open=sidebar.classList.toggle('open');menu.setAttribute('aria-expanded',String(open))});document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();if(innerWidth<=720){sidebar.classList.add('open');menu.setAttribute('aria-expanded','true')}input.focus()}if(e.key==='Escape'){sidebar.classList.remove('open');menu.setAttribute('aria-expanded','false');input.blur()}});render();
</script></body></html>
