[build.env]
passthrough = [
    "SQLX_OFFLINE",
    "PKG_CONFIG_ALLOW_CROSS",
    "OPENSSL_STATIC",
    "OPENSSL_LIB_DIR",
    "OPENSSL_INCLUDE_DIR",
]

[target.aarch64-unknown-linux-gnu]
pre-build = [
    "dpkg --add-architecture arm64",
    "apt-get update",
    "apt-get install -y --no-install-recommends libssl-dev:arm64 pkg-config protobuf-compiler",
]
